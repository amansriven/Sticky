[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sticky"
version = "0.1.1"
description = "Explain why macOS keeps asking for permissions, and make them stick."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
sticky = "sticky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
